name: Release Candidate

run-name: Build GitHub draft v${{ inputs.version }} from ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version, for example 1.4.0 or 1.4.0b1"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character commit SHA approved for release"
        required: true
        type: string
      release_kind:
        description: "Stable creates a normal draft; beta creates a prerelease draft"
        required: true
        default: stable
        type: choice
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

env:
  DIST_DIR: dist

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate owner, branch, SHA, version, and tag
        id: metadata
        shell: bash
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SELECTED_REF: ${{ github.ref }}
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          actual_sha="$(echo "$ACTUAL_SHA" | tr '[:upper:]' '[:lower:]')"
          expected_sha="$(echo "$EXPECTED_SHA" | xargs | tr '[:upper:]' '[:lower:]')"
          version="$(echo "$RELEASE_VERSION" | xargs)"
          [[ "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]]
          [[ "$SELECTED_REF" == "refs/heads/main" ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ && "$expected_sha" == "$actual_sha" ]]
          case "$RELEASE_KIND" in
            stable)
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              title="ha-history-exporter $version"
              ;;
            beta)
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]
              title="ha-history-exporter $version (Beta)"
              ;;
            *) exit 1 ;;
          esac
          package_version="$(sed -n -E 's/^__version__ = "(.*)"$/\1/p' src/ha_history_exporter/__init__.py)"
          [[ "$package_version" == "$version" ]]
          tag="v$version"
          ! git show-ref --verify --quiet "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Audit the publishable tree and reachable history
        run: python tools/privacy_audit.py --repository . --history

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      HA_URL: ""
      HA_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check ".[parquet]"
      - run: python -m pytest --cov=ha_history_exporter --cov-report=term-missing
      - run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

  build:
    name: Build release artifacts
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Audit the runtime dependencies
        run: python tools/audit_runtime.py
      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir "$DIST_DIR"
          python -m twine check "$DIST_DIR"/*
          python tools/verify_wheel.py "$DIST_DIR"
          python tools/privacy_audit.py --repository . \
            --artifact "$DIST_DIR"/*.whl --artifact "$DIST_DIR"/*.tar.gz
          cd "$DIST_DIR"
          sha256sum -- *.whl *.tar.gz > checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.tag }}
          path: |
            ${{ env.DIST_DIR }}/*.whl
            ${{ env.DIST_DIR }}/*.tar.gz
            ${{ env.DIST_DIR }}/checksums.txt
          if-no-files-found: error
          retention-days: 14

  create-draft-release:
    name: Create unpublished GitHub draft
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_KIND: ${{ inputs.release_kind }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_TITLE: ${{ needs.validate.outputs.title }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.tag }}
          path: release-assets
      - name: Verify assets and refuse an existing release
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict checksums.txt
          cd ..
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1
      - name: Create the unpublished draft
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '> Automatically built and tested release draft. Review before publishing.' \
            '' "Target commit: \`$EXPECTED_SHA\`" '' '## Release notes' '' \
            'Replace this paragraph with the approved user-facing release notes.' \
            > "$notes_file"
          args=(gh release create "$RELEASE_TAG" release-assets/*
            --repo "$GITHUB_REPOSITORY" --draft --target "$EXPECTED_SHA"
            --title "$RELEASE_TITLE" --notes-file "$notes_file")
          if [[ "$RELEASE_KIND" == "beta" ]]; then
            args+=(--prerelease --latest=false)
          fi
          "${args[@]}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url \
            | sed 's/^/url=/' >> "$GITHUB_OUTPUT"
      - name: Summarize the manual publication gate
        run: |
          echo "Draft: ${{ steps.draft.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing this release triggers the separate PyPI workflow." >> "$GITHUB_STEP_SUMMARY"
