[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-history-exporter"
dynamic = ["version"]
description = "Local command-line tool that exports Home Assistant state history to JSONL, CSV, and Parquet through the REST API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "hyperfelixations" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Developers",
  "Topic :: Home Automation",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "requests>=2.31.0",
  "platformdirs>=4.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0"]

[project.scripts]
ha-history-exporter = "ha_history_exporter.cli:ha_history_exporter"
hhe = "ha_history_exporter.cli:hhe"

[project.urls]
Homepage = "https://github.com/hyperfelixations/ha-history-exporter"
Repository = "https://github.com/hyperfelixations/ha-history-exporter"
Issues = "https://github.com/hyperfelixations/ha-history-exporter/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ha_history_exporter*"]
namespaces = false

[tool.setuptools.package-data]
ha_history_exporter = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "ha_history_exporter.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
  "S101",     # assert is the idiom the test suite is built on
  "RUF002",   # en dashes and other typography in prose are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
# setting() returns dataclasses.field() with the key metadata.
"src/ha_history_exporter/settings/model.py" = ["RUF009"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src/ha_history_exporter", "tests", "tools"]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--disable-socket",
  "--import-mode=importlib",
]
testpaths = ["tests"]
markers = [
  "parquet: needs the optional pyarrow; deselect with -m 'not parquet' where it is absent",
]

[tool.coverage.run]
branch = true
source = ["ha_history_exporter"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
