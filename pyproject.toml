[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-history-exporter"
dynamic = ["version"]
description = "Local command-line tool that exports Home Assistant state history to JSONL, CSV, and Parquet through the REST API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "hyperfelixations" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Developers",
  "Topic :: Home Automation",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0",
  "platformdirs>=4.2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0"]

[project.scripts]
ha-history-exporter = "ha_history_exporter.cli:main"
hhe = "ha_history_exporter.cli:main"

[project.urls]
Homepage = "https://github.com/hyperfelixations/ha-history-exporter"
Repository = "https://github.com/hyperfelixations/ha-history-exporter"
Issues = "https://github.com/hyperfelixations/ha-history-exporter/issues"

[tool.setuptools]
packages = [
  "ha_history_exporter",
  "ha_history_exporter.cli",
  "ha_history_exporter.cli.commands",
  "ha_history_exporter.runtime",
  "ha_history_exporter.settings",
]

[tool.setuptools.package-data]
ha_history_exporter = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "ha_history_exporter.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
  "S101",     # assert is the idiom the test suite is built on
  "UP006",    # typing.List/Dict spellings stay until the codebase moves as a whole
  "UP007",    # same for Optional/Union
  "UP035",
  "RUF002",   # en dashes and other typography in prose are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["ha_history_exporter"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "ha_history_exporter.cli.*",
  "ha_history_exporter.errors",
  "ha_history_exporter.console",
  "ha_history_exporter.runtime.*",
  "ha_history_exporter.settings.*",
]
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--disable-socket",
]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "known_bug: executable specification for a confirmed product defect",
]

[tool.coverage.run]
branch = true
source = ["ha_history_exporter"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
