home_assistant:
  url_env: HA_URL
  token_env: HA_TOKEN
  timezone: Europe/Berlin

export:
  # Defaults to <your home directory>/ha-history-exports.
  # Uncomment to send exports, metadata, and logs somewhere else.
  # output_dir: "D:\\ha-history-archive"
  mode: all_current_entities
  include_current_day: false
  resume: true
  force: false

requests:
  batch_size_entities: 15
  sleep_between_requests_seconds: 0.7
  sleep_between_days_seconds: 5.0
  request_timeout_seconds: 120
  max_retries: 3
  backoff_seconds: [2, 5, 15]

formats:
  # Set all three values to false for snapshot-only mode (no History API call).
  jsonl: true
  csv: false
  parquet: false

storage:
  use_temp_dir: true
  temp_dir: "%LOCALAPPDATA%\\ha_history_export_tmp"
  cloud_storage_retry_count: 5
  cloud_storage_retry_sleep_seconds: 2.0

history_request:
  minimal_response: false
  no_attributes: false
  significant_changes_only: false

recorder:
  export_long_term_statistics: false
  expected_purge_keep_days: 14

entity_selection:
  source: api_states_runtime
  include_unknown: true
  include_unavailable: true
  include_deleted_from_previous_runs: false
  optional_exclude_patterns: []
  optional_exclude_domains: []
